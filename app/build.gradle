plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.majulancar.kasir'
    compileSdk 34

    defaultConfig {
        applicationId "com.majulancar.kasir"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables { useSupportLibrary true }
    }

    // --- Signing -------------------------------------------------------
    // Release builds are signed with a real upload keystore when the
    // KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
    // secrets are supplied (e.g. from GitHub Actions). If they are not
    // present (first run, or a local build), we fall back to the
    // auto-generated debug keystore so `assembleRelease` always produces
    // an installable APK. Replace with your own keystore + secrets for a
    // Play Store / production release. See README.md.
    def ksFile = file("${rootDir}/app/release.keystore")
    def hasRealKeystore = ksFile.exists() &&
            System.getenv("KEYSTORE_PASSWORD") != null &&
            System.getenv("KEY_ALIAS") != null &&
            System.getenv("KEY_PASSWORD") != null

    signingConfigs {
        if (hasRealKeystore) {
            release {
                storeFile ksFile
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig hasRealKeystore ? signingConfigs.release : signingConfigs.debug
            debuggable false
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        viewBinding true
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.fragment:fragment-ktx:1.8.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.4'

    // Navigation Component — drives the bottom-nav + fragment navigation graph.
    implementation 'androidx.navigation:navigation-fragment-ktx:2.7.7'
    implementation 'androidx.navigation:navigation-ui-ktx:2.7.7'

    // EncryptedSharedPreferences — at-rest encryption for cart & sales data.
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // Lightweight, Kotlin-first image loader (HTTPS only) for menu photos.
    implementation 'io.coil-kt:coil:2.6.0'

    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'

    // QR *encoding* only (no camera/scanning module, no extra permission)
    // used to render the QRIS payload as a real scannable QR bitmap.
    implementation 'com.google.zxing:core:3.5.3'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
